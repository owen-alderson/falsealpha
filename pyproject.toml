[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "falsealpha"
version = "0.2.1"
description = "A C++ alpha-mining engine that searches formulaic trading signals, then tells you which of its discoveries are fake."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Owen Alderson" }]
keywords = ["quant", "alpha", "genetic-programming", "backtesting", "overfitting", "deflated-sharpe"]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.26", "certifi"]

[project.optional-dependencies]
dev = ["pytest>=8", "pandas>=2.0"]

[project.scripts]
falsealpha = "falsealpha.cli:main"

[project.urls]
Homepage = "https://github.com/owen-alderson/falsealpha"

[tool.scikit-build]
wheel.packages = ["src/falsealpha"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
